# Configuracion de simulacion IndexedCAM: cabezal B+C (head-head), 3+2 indexado.
# Cinematica: 5axiskins (XYZBCW, 6 joints) -- el programa escribe la PUNTA de la
# herramienta y el modulo compensa el pivote. Ver docs/POST_LINUXCNC.md.

[EMC]
VERSION = 1.1
# NML propio: permite una segunda instancia (p.ej. la comprobacion automatica)
# sin chocar con la sesion abierta del usuario.
NML_FILE = ./indexedcam.nml
MACHINE = IndexedCAM 3+2 head-head B+C (simulacion)
DEBUG = 0

[DISPLAY]
DISPLAY = axis
# El visor 3D de Axis aplica las rotativas EN EL ORDEN de esta cadena (y las
# compone en ese orden), asi que tiene que ir C antes que B para reproducir
# R = Rz(C) @ Ry(B), que es la cinematica de 5axiskins. Con "XYZBC" la C gira
# la herramienta sobre su propio eje y no cambia la orientacion: la herramienta
# se ve horizontal apuntando siempre al mismo lado en las caras +Y/-Y.
# Es solo el dibujo: la maquina y la ventana vismach ya estaban bien.
GEOMETRY = XYZCBW
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
INCREMENTS = 10 mm, 1 mm, .1 mm
PROGRAM_PREFIX = ./
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 1
TOOL_EDITOR = tooledit z diam
OPEN_FILE = ./validate_bc.ngc

[RS274NGC]
PARAMETER_FILE = indexedcam.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui
# -no_use_hal_manualtoolchange: M6 cambia de herramienta sin pedir confirmacion,
# para poder lanzar programas en bucle durante las pruebas.
HALFILE = LIB:basic_sim.tcl -no_use_hal_manualtoolchange
HALFILE = indexedcam.hal
# Comenta esta linea si no quieres la ventana 3D del cabezal (vismach).
HALFILE = indexedcam_vismach.hal

[HALUI]
MDI_COMMAND = G0 B0 C0
MDI_COMMAND = G69
MDI_COMMAND = G53 G0 Z0

[EMCIO]
TOOL_TABLE = indexedcam.tbl
TOOL_CHANGE_POSITION = 0 0 100

[TRAJ]
COORDINATES = XYZBCW
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_ANGULAR_VELOCITY = 360.0
DEFAULT_LINEAR_VELOCITY = 100.0
MAX_LINEAR_VELOCITY = 200.0
MAX_LINEAR_ACCELERATION = 500.0
DEFAULT_LINEAR_ACCELERATION = 500.0

[KINS]
# 5axiskins necesita las coordenadas XYZBCW (6 joints):
#   x:joint0  y:joint1  z:joint2  b:joint3  c:joint4  w:joint5
#
# La W no es opcional: el modulo trae "REQUIRED_COORDINATES XYZBCW" y si se
# omite no carga ("kinsParamsMapCoordinates: ERROR ... insmod failed").
# No hace falta motor para ella: su valor se suma al movimiento de X/Y/Z y aqui
# nunca se programa, asi que se queda en 0. Solo se usa si algun dia se monta un
# cabezal con carrera de herramienta.
JOINTS = 6
KINEMATICS = 5axiskins coordinates=xyzbcw

[AXIS_X]
MIN_LIMIT = -500
MAX_LIMIT = 500
MAX_VELOCITY = 200
MAX_ACCELERATION = 500

[AXIS_Y]
MIN_LIMIT = -500
MAX_LIMIT = 500
MAX_VELOCITY = 200
MAX_ACCELERATION = 500

[AXIS_Z]
# El recorrido en Z+ tiene que cubrir la altura de retirada de los programas,
# que se mide desde la pieza. Con el pivote 250 mm y B=0 el carro queda a la
# altura de la punta: un retirada a Z=130 sobre una pieza a Z=30 pide joint 2=130.
MIN_LIMIT = -500
MAX_LIMIT = 250
MAX_VELOCITY = 200
MAX_ACCELERATION = 500

[AXIS_B]
MIN_LIMIT = -120
MAX_LIMIT = 120
MAX_VELOCITY = 60
MAX_ACCELERATION = 200

[AXIS_C]
MIN_LIMIT = -360
MAX_LIMIT = 360
MAX_VELOCITY = 60
MAX_ACCELERATION = 200

# W no se programa nunca desde IndexedCAM; existe para el modulo de cinematica.
[AXIS_W]
MIN_LIMIT = -100
MAX_LIMIT = 500
MAX_VELOCITY = 200
MAX_ACCELERATION = 500

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -500
MAX_LIMIT = 500
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -500
MAX_LIMIT = 500
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -500
MAX_LIMIT = 250
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_3]
TYPE = ANGULAR
MIN_LIMIT = -120
MAX_LIMIT = 120
MAX_VELOCITY = 60
MAX_ACCELERATION = 200
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_4]
TYPE = ANGULAR
MIN_LIMIT = -360
MAX_LIMIT = 360
MAX_VELOCITY = 60
MAX_ACCELERATION = 200
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_5]
TYPE = LINEAR
MIN_LIMIT = -100
MAX_LIMIT = 500
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0
